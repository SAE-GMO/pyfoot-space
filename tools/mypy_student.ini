; Typpruefung fuer Schuelerloesungen.
;
; Bewusst milder als die Pruefung des Projekts selbst (siehe pyproject.toml,
; dort gilt strict). Hier gilt:
;
;   - Annotationen sind NICHT Pflicht. Wer sie weglaesst, bekommt keine Ruege.
;   - Die Rumpfe von Methoden ohne Annotation werden trotzdem geprueft.
;     Ohne check_untyped_defs uebergeht mypy sie stillschweigend und findet
;     dann gar nichts -- genau das waere fuer den Unterricht wertlos.
;
; Die Pruefung ist nicht blockierend: Sie meldet, verhindert aber nichts.

[mypy]
python_version = 3.11
mypy_path = .

check_untyped_defs = True
ignore_missing_imports = True

show_error_codes = True
pretty = True
color_output = False
error_summary = True
